name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    # Cancel superseded builds without interrupting an in-flight Pages deployment.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Both browser checks run headless, so only the headless shell is installed.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - run: npm run build
      - run: npm run test:preview
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  linux:
    runs-on: ubuntu-24.04
    concurrency:
      group: linux-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential pkg-config librsvg2-dev patchelf
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run desktop:linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows:
    name: Windows MSVC via cargo-xwin (Linux host)
    runs-on: ubuntu-24.04
    concurrency:
      group: windows-${{ github.ref }}
      cancel-in-progress: true
    env:
      XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin-cache
      XWIN_ARCH: x86_64
      CARGO_XWIN_VERSION: "0.23.1"
      RUST_TARGET: "x86_64-pc-windows-msvc"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET}}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-xwin-${{ env.CARGO_XWIN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .xwin-cache
          key: xwin-cache-${{ runner.os }}-${{ env.XWIN_ARCH }}-${{ env.CARGO_XWIN_VERSION }}
      - name: Install cross-compilation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm python3-venv
          python3 -m venv "$RUNNER_TEMP/cargo-xwin"
          "$RUNNER_TEMP/cargo-xwin/bin/pip" install --no-cache-dir "cargo-xwin==$CARGO_XWIN_VERSION"
          echo "$RUNNER_TEMP/cargo-xwin/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run desktop:windows
      - uses: actions/upload-artifact@v7
        with:
          path: target/${{ env.RUST_TARGET}}/release/tauri-ssh-template.exe
          archive: false
          if-no-files-found: error
